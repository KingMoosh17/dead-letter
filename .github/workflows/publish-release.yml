name: Publish Dead Letter Release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_REQUEST.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dead-letter-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve requested version
        shell: pwsh
        run: |
          $request = (Get-Content RELEASE_REQUEST.txt -First 1).Trim()
          $version = ($request -split '\s+')[0]
          $current = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "RELEASE_REQUEST.txt must begin with a semantic version such as 1.2.0."
          }
          if ($version -ne $current) {
            throw "Requested version $version does not match VERSION.txt ($current)."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET=Dead_Letter_v$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate release source
        shell: pwsh
        run: |
          $required = @(
            "main.py", "game_logic.py", "effects.py", "content.py", "wordbank.py",
            "sound.py", "storage.py", "telemetry.py", "ui_patch.py", "release_patch.py", "chapter_patch.py", "balance_patch.py",
            "update_manager.py", "updater.py", "DeadLetter.pyw", "build_icon.py",
            "VERSION.txt", "update_config.json", "data/words.csv"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required release file: $path" }
          }

      - name: Install build tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pillow

      - name: Syntax, chapter-flow, and balance checks
        shell: pwsh
        run: |
          python -m py_compile ui_patch.py release_patch.py chapter_patch.py balance_patch.py update_manager.py updater.py DeadLetter.pyw build_icon.py
          python -c "import content, wordbank, storage; print('Source imports OK')"
          @'
          import main
          import ui_patch, release_patch, chapter_patch, balance_patch
          from content import GLYPHS, AXIOMS
          from wordbank import WordBank
          from game_logic import GameState

          ui_patch.apply_patch(main)
          release_patch.apply_patch(main)
          chapter_patch.apply_patch(main)
          balance_patch.apply_patch(main)

          bank = WordBank('data/words.csv', 'standard')

          # Chapter-preview flow still gates the first timed word.
          game = GameState(bank, seed=123456, difficulty='medium', bank_id='standard', telemetry_enabled=False)
          game.start_round()
          assert game.status == 'chapter_ready', game.status
          assert game.round is None
          assert game.can_save()

          game._chapter_preview_entering = True
          game.start_round()
          del game._chapter_preview_entering
          assert game.status == 'playing', game.status
          assert game.round is not None

          game.round_index = 4
          game.round = None
          game.status = 'axiom_choice'
          game.start_round()
          assert game.status == 'chapter_ready', game.status
          assert game.chapter == 2

          # Clear dominance fixes are present in the public definitions.
          assert 'up to 7 total' in GLYPHS['thesaurus'].description
          assert 'up to 6 total' in GLYPHS['index_cards'].description
          assert '+7 seconds' in AXIOMS['overtime'].description
          assert '+2 mistake capacity' in AXIOMS['boss_insurance'].description
          assert '5 absent letters' in AXIOMS['preparation'].description
          assert '5 absent letters' in AXIOMS['footnotes'].description

          def enter_first(g):
              g.start_round()
              assert g.status == 'chapter_ready'
              g._chapter_preview_entering = True
              try:
                  g.start_round()
              finally:
                  del g._chapter_preview_entering
              assert g.round is not None

          # Rare information scalers now start with useful baseline value.
          thes = GameState(bank, seed=222, difficulty='medium', bank_id='standard', telemetry_enabled=False)
          thes.glyphs = ['thesaurus']; thes._init_glyph_state('thesaurus')
          enter_first(thes)
          assert len(thes.round.eliminated_letters) == 1, len(thes.round.eliminated_letters)

          cards = GameState(bank, seed=333, difficulty='medium', bank_id='standard', telemetry_enabled=False)
          cards.glyphs = ['index_cards']; cards._init_glyph_state('index_cards')
          enter_first(cards)
          assert len(cards.round.eliminated_letters) == 2, len(cards.round.eliminated_letters)

          # Overtime is now a larger time tradeoff than Grace Period, not a
          # smaller bonus with an added downside.
          base = GameState(bank, seed=444, difficulty='medium', bank_id='standard', telemetry_enabled=False)
          enter_first(base)
          over = GameState(bank, seed=444, difficulty='medium', bank_id='standard', telemetry_enabled=False)
          over.axioms = ['overtime']
          enter_first(over)
          assert abs((over.round.initial_time - base.round.initial_time) - 7.0) < 0.001

          # Boss-only insurance/preparation are stronger than their global
          # counterparts on the round where they specialize.
          boss = GameState(bank, seed=555, difficulty='medium', bank_id='standard', telemetry_enabled=False)
          boss.round_index = 3
          boss.chapter_bosses[0] = 'editor'
          boss.axioms = ['boss_insurance', 'preparation']
          boss.start_round()
          assert boss.round.boss_id == 'editor'
          assert boss.round.max_mistakes == 8, boss.round.max_mistakes
          assert len(boss.round.eliminated_letters) == 5, len(boss.round.eliminated_letters)

          print('Chapter preview and v1.1.11 balance checks OK')
          '@ | python -

      - name: Generate application icons
        shell: pwsh
        run: python build_icon.py

      - name: Build Dead Letter executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DeadLetter `
            --icon DeadLetter.ico `
            --add-data "data;data" `
            --add-data "update_config.json;." `
            --add-data "DeadLetter.ico;." `
            DeadLetter.pyw

      - name: Build updater executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DeadLetterUpdater `
            --icon DeadLetterUpdater.ico `
            updater.py

      - name: Assemble public package
        shell: pwsh
        run: |
          $pkg = "release_package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg\data" | Out-Null
          Copy-Item "dist\DeadLetter.exe" "$pkg\DeadLetter.exe"
          Copy-Item "dist\DeadLetterUpdater.exe" "$pkg\DeadLetterUpdater.exe"
          Copy-Item "VERSION.txt" "$pkg\VERSION.txt"
          Copy-Item "update_config.json" "$pkg\update_config.json"
          Copy-Item "README.md" "$pkg\README.md"
          Copy-Item "CHANGELOG.md" "$pkg\CHANGELOG.md"
          $sourceFiles = @(
            "DeadLetter.pyw", "main.py", "game_logic.py", "effects.py", "content.py",
            "wordbank.py", "sound.py", "storage.py", "telemetry.py",
            "ui_patch.py", "release_patch.py", "chapter_patch.py", "balance_patch.py", "update_manager.py", "updater.py"
          )
          foreach ($file in $sourceFiles) { Copy-Item $file "$pkg\$file" }
          Copy-Item "data\words.csv" "$pkg\data\words.csv"
          if (Test-Path "data\sfx") { Copy-Item "data\sfx" "$pkg\data\sfx" -Recurse }

      - name: Build release ZIP
        shell: pwsh
        run: |
          @'
          import hashlib
          import os
          import pathlib
          import zipfile
          root = pathlib.Path("release_package")
          asset = pathlib.Path("dist") / os.environ["ASSET"]
          with zipfile.ZipFile(asset, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(root).as_posix())
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          pathlib.Path(str(asset) + ".sha256").write_text(f"{digest}  {asset.name}\n", encoding="utf-8")
          print(asset, digest)
          '@ | python -

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" "dist\$env:ASSET" "dist\$env:ASSET.sha256" --clobber
          } else {
            gh release create "$env:TAG" `
              "dist\$env:ASSET" `
              "dist\$env:ASSET.sha256" `
              --target "$env:GITHUB_SHA" `
              --title "Dead Letter v$env:VERSION" `
              --generate-notes
          }

      - name: Summary
        shell: pwsh
        run: |
          "Published $env:TAG with $env:ASSET, a branded game executable, and a distinct updater executable." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
